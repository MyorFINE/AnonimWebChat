# /etc/nginx/sites-available/termchat  (SSL SHART: certbot --nginx -d chat.example.com — brauzer shifrlashi (WebCrypto) faqat HTTPS'da ishlaydi)
# Muhim: nginx'da gzip/minify/sub_filter yoqmang — /static fayllari baytma-bayt o'zgarmasligi kerak (SRI hash).
server {
    listen 80;
    server_name chat.example.com;
    client_max_body_size 64m;      # 50 MB fayl + shifr/multipart qo'shimchasi uchun zaxira bilan

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
